spring.application.name=NewOSPFU

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.caspar.entity,com.caspar.entity.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
# 管理角色注册密钥（/api/user/register 里注册 ADMIN / DORM_MANAGER 时使用）
app.admin-register.key=${ADMIN_REGISTER_KEY:}

# Server Configuration
server.port=8080
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.file.max-size-bytes=10485760
# 认证接口限流（登录/注册）
app.security.rate-limit.auth.max-requests=20
app.security.rate-limit.auth.window-seconds=60
app.security.rate-limit.auth.cache-expire-minutes=120

# Amap Configuration (Web服务API)
amap.web.key=${AMAP_WEB_KEY:}
amap.web.security.code=${AMAP_WEB_SECURITY_CODE:}

# ===================================================================
# Aliyun OSS Configuration (阿里云对象存储配置)
# ===================================================================
# 重要: AccessKeyID 和 AccessKeySecret 需通过系统环境变量获取:
#   export ALIBABA_CLOUD_ACCESS_KEY_ID=your_access_key_id
#   export ALIBABA_CLOUD_ACCESS_KEY_SECRET=your_access_key_secret
# ===================================================================
# 使用环境变量 ALIBABA_CLOUD_ACCESS_KEY_ID 和 ALIBABA_CLOUD_ACCESS_KEY_SECRET 进行身份验证
aliyun.oss.endpoint=https://oss-cn-beijing.aliyuncs.com
aliyun.oss.bucket=my-campus-2024
aliyun.oss.region=cn-beijing
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET:}

# SpringDoc OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}

# ===================================================================
# Redis Configuration (Agent会话管理)
# ===================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
# spring.data.redis.password=  # 如有密码请配置

# ===================================================================
# Spring AI / SiliconFlow Configuration (硅基流动大模型接口)
# ===================================================================
# API Key 和 Base URL 通过环境变量读取，禁止硬编码
# 硅基流动兼容 OpenAI 协议
# 使用前请设置：export SPRING_AI_OPENAI_API_KEY=sk-xxxxxxx (你的硅基流动API Key)
#               export SPRING_AI_OPENAI_BASE_URL=https://api.siliconflow.cn
#               export LLM_MODEL=deepseek-ai/DeepSeek-V3 (推荐使用的模型)
# ===================================================================
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
# 硅基流动 API 地址 (已预填好)
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.siliconflow.cn}

# 使用的模型 (已切换为 Qwen/Qwen2.5-72B-Instruct)
# 可选: Qwen/Qwen2.5-7B-Instruct (速度快), Qwen/Qwen2.5-72B-Instruct (能力强)
spring.ai.openai.chat.options.model=${LLM_MODEL:Qwen/Qwen2.5-72B-Instruct}
spring.ai.openai.chat.options.temperature=0.2
agent.llm.timeout-ms=30000
agent.llm.retry.max-attempts=2
agent.llm.retry.backoff-ms=300
agent.session.ttl-minutes=30
agent.session.memory.max-size=10000
agent.session.restore-history-limit=20
agent.tool-executor.core-pool-size=8
agent.tool-executor.max-pool-size=32
agent.tool-executor.queue-capacity=500
agent.tool-executor.keep-alive-seconds=60

# 通用问答联网检索开关（UNKNOWN/GENERAL_CHAT 分支）
agent.web-search.enabled=true
agent.web-search.timeout-ms=2500

# ===================================================================
# Agent Function Calling / Tool Calling Configuration
# ===================================================================
# 主链路采用单 Agent + 本地函数调用：
#   LLM识别意图/提取槽位 -> PlannerService 选择函数 -> ToolExecutorService 调用本地 AgentTool。
# MCP 仅作为后续跨进程/跨系统工具接入的可选扩展，默认关闭。
# 如需启用 MCP，请配置真实可用的 stdio server command/args。
# ===================================================================
agent.mcp.enabled=false
agent.mcp.fallback-to-local=true
# agent.mcp.command=npx
# agent.mcp.args=-y,@modelcontextprotocol/server-filesystem,/Users/yy/code/OSP
agent.mcp.startup-timeout-ms=15000
agent.mcp.call-timeout-ms=30000
agent.mcp.circuit-breaker-failure-threshold=3
agent.mcp.circuit-breaker-open-ms=60000
agent.mcp.pending-warning-threshold=5
# 工具名映射（可选）：本地工具名 -> MCP工具名
# agent.mcp.tool-name-mapping.navigation_v2=navigation
